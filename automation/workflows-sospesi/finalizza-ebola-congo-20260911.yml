name: Finalizza aggiornamento Ebola Congo 12 settembre 2026

on:
  push:
    paths:
      - '.github/workflows/finalizza-ebola-congo-20260911.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalizza:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dipendenze
        run: pip install lxml

      - name: Prepara finalizzatore v325
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/finalize_articles_20260906.py')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'TARGETS = \{.*?\}\n\nREG_PATH', 'TARGETS = {\n    "notizie/ebola-congo-6757-casi-3267-decessi-10-settembre-2026.html": "ebola-congo-6757-casi-ai-openai-v325",\n}\n\nREG_PATH', s, count=1, flags=re.S)
          s=s.replace('285','325')
          s=s.replace('if info["dateISO"][:10] < "2026-09-04": continue','if info["dateISO"][:10] < "2026-09-09": continue')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Aggiorna superfici editoriali
        run: python3 tools/finalize_articles_20260906.py

      - name: Aggiorna stato release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for name in ('curiomondo-site-manifest.json','RELEASE-STATE.json','CURIOMONDO-RELEASE-STATE.json'):
              p=Path(name)
              if not p.exists(): continue
              d=json.loads(p.read_text(encoding='utf-8'))
              if name=='curiomondo-site-manifest.json':
                  d.setdefault('site',{})['current_site_version']=325
                  d['site']['site_version']=325
              else:
                  for k in ('site_version','currentVersion'):
                      if k in d: d[k]=325
                  if 'version' in d: d['version']='325'
                  if 'baseline_version' in d: d['baseline_version']=324
                  if 'baselineVersion' in d: d['baselineVersion']=324
                  if 'release_date' in d: d['release_date']='2026-09-12'
                  if 'date' in d: d['date']='2026-09-12'
                  if 'last_update' in d: d['last_update']='ebola-congo-7022-casi-sud-ubangi-v325'
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Gate predeploy
        run: python3 tools/predeploy.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi
          git commit -m "v325: aggiorna Ebola Congo e superfici editoriali"
          git push

# aggiornamento 12 settembre: 7.022 casi, 3.398 decessi, Sud-Ubangi settima provincia
