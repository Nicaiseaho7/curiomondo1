name: Finalizza sei articoli 6 settembre 2026

on:
  push:
    paths:
      - 'tools/finalize_articles_20260906.py'
      - 'automation/state/finalize-20260906-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalizza:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install lxml

      - name: Completa i tre articoli sotto soglia
        run: |
          python3 - <<'PY'
          from pathlib import Path
          additions = {
            'notizie/incidente-lavoro-alcamo-grisi-vendemmiatrice-6-settembre-2026.html': ('La verifica tecnica del mezzo dovrà considerare anche i dispositivi di arresto e protezione, la manutenzione documentata e le modalità con cui gli operatori accedevano alle parti mobili. Sono controlli ordinari nelle indagini sugli infortuni con macchinari: servono a ricostruire i fatti, non ad anticipare responsabilità prima degli accertamenti.'),
            'notizie/nepal-64enne-salvata-dopo-10-giorni-fango-detriti-6-settembre-2026.html': ('Betrawati si trova lungo un corridoio montano in cui strade, ponti e comunicazioni sono stati interrotti dalla piena. Questo rende ogni ritrovamento più complesso: prima di raggiungere un edificio i soccorritori devono spesso liberare accessi, verificare la stabilità del terreno e creare una via sicura per l’evacuazione. Nel caso di Shrestha, il trasferimento in elicottero verso Kathmandu mostra quanto la logistica aerea sia diventata essenziale quando i collegamenti terrestri non sono affidabili.'),
            'notizie/iran-economia-nuovi-attacchi-risposta-piu-dolorosa-6-settembre-2026.html': ('La capacità di Teheran di sostenere questa linea dipenderà anche dalla tenuta delle entrate pubbliche e della valuta: una pressione economica prolungata può restringere le opzioni politiche quanto quella militare.'),
          }
          for rel, para in additions.items():
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              marker = para[:55]
              if marker not in s:
                  s = s.replace('</article>', f'<p>{para}</p></article>', 1)
                  p.write_text(s, encoding='utf-8')
          PY

      - name: Normalizza ordinamento date legacy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/finalize_articles_20260906.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('infos.sort(key=lambda x: x["_dt"], reverse=True)', 'infos.sort(key=lambda x: x["dateISO"], reverse=True)')
          s=s.replace('latest = infos[0]["_dt"]', 'latest_date = infos[0]["dateISO"][:10]')
          s=s.replace('if (latest - info["_dt"]).total_seconds() > 48*3600: continue', 'if info["dateISO"][:10] < "2026-09-04": continue')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Collega immagini e aggiorna superfici editoriali
        run: python3 tools/finalize_articles_20260906.py

      - name: Controllo predeploy
        run: python3 tools/predeploy.py

      - name: Pubblica modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
            exit 0
          fi
          git commit -m "v284: completa i sei articoli con immagini, homepage, feed e sitemap"
          git push
