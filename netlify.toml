[build]
  command = "python3 tools/predeploy.py"
  publish = "."

[functions]
  directory = "netlify/functions"
  included_files = ["automation/**"]

[functions."live-refresh"]
  schedule = "*/10 * * * *"

[functions."auto-editor"]
  schedule = "0 */2 * * *"

[functions."library-daily"]
  schedule = "15 3 * * *"
