name: Pubblica Antonelli Madrid 13 settembre 2026
on:
  push:
    branches: ["automation/publish-antonelli-madrid-20260913"]
    paths: [".github/workflows/publish-antonelli-madrid-20260913.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/publish-antonelli-madrid-20260913
          fetch-depth: 0
      - name: Aggiorna sito
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,html
          slug='kymi-antonelli-vince-gp-spagna-madrid-madring-13-settembre-2026'
          slug='kimi-antonelli-vince-gp-spagna-madrid-madring-13-settembre-2026'
          title='Formula 1, Antonelli vince il primo GP di Madrid e allunga nel Mondiale'
          excerpt='Il ventenne italiano della Mercedes conquista l’ottava vittoria stagionale al Madring davanti a Verstappen e Norris. Il vantaggio su Russell sale a 81 punti dopo 14 gare.'
          url=f'https://curiomondo.it/notizie/{slug}.html'
          pub='2026-09-13T22:58:00+02:00'
          img='/assets/images/editorial-auto/kimi-antonelli-vittoria-monza-6-settembre-2026-ai-v289-1200.webp'
          article=f'''<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{title} | CurioMondo</title><meta name="description" content="{excerpt}"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="{url}"><meta property="og:type" content="article"><meta property="og:title" content="{title}"><meta property="og:description" content="{excerpt}"><meta property="og:url" content="{url}"><meta property="og:image" content="https://curiomondo.it{img}"><meta name="theme-color" content="#eaf8ff"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="../assets/css/site-base-v210.css"><link rel="stylesheet" href="../assets/css/curiomondo-article-v211.css"><link rel="stylesheet" href="../assets/css/editorial-trust-v263.css"><link rel="stylesheet" href="/assets/css/global-header-v275.css"><script type="application/ld+json">{{"@context":"https://schema.org","@type":"NewsArticle","headline":{json.dumps(title,ensure_ascii=False)},"description":{json.dumps(excerpt,ensure_ascii=False)},"datePublished":"{pub}","dateModified":"{pub}","mainEntityOfPage":"{url}","inLanguage":"it-IT","author":{{"@type":"Organization","name":"Redazione CurioMondo","url":"https://curiomondo.it/pagine/redazione.html"}},"publisher":{{"@type":"Organization","name":"CurioMondo","logo":{{"@type":"ImageObject","url":"https://curiomondo.it/curiomondo-logo-512.png"}}}},"image":["https://curiomondo.it{img}"]}}</script><script defer src="/assets/js/global-header-v275.js"></script></head><body data-article-id="{slug}"><div class="cm-reading-progress" aria-hidden="true"></div><header class="cm-global-header" data-cm-global-header="v275"><nav class="cm-global-header__inner" aria-label="Navigazione della pagina"><a class="cm-global-header__back" href="/" aria-label="Torna alla home di CurioMondo"><span class="cm-global-header__back-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19 12H5"></path><path d="m11 18-6-6 6-6"></path></svg></span></a><a class="cm-global-header__brand" href="/" aria-label="CurioMondo, home"><span aria-hidden="true">Curio<span>Mondo</span></span></a><button class="cm-global-header__theme" data-cm-global-theme type="button" aria-label="Attiva modalità scura" aria-pressed="false"><span aria-hidden="true">☾</span></button></nav></header><main class="wrap"><div class="badge">Sport / Formula 1 / GP di Spagna</div><h1>{title}</h1><p class="subtitle">{excerpt}</p><div class="meta">13 settembre 2026 · aggiornato alle 22:58 · Sport / Formula 1 · <span id="readTime">4 min di lettura</span></div><p class="cm-article-byline">A cura della <a href="/pagine/redazione.html" rel="author">Redazione CurioMondo</a> · <a href="/pagine/metodo-editoriale.html">Come lavoriamo</a></p><div class="actions"><button class="primary" id="listenBtn" type="button">▶ Ascolta l’audio</button><button type="button" data-share-article>↗ Condividi</button><button id="cmSaveBtn" type="button">★ Salva</button></div><figure class="article-image" data-ai-generated="true"><img src="{img}" width="1200" height="800" alt="Illustrazione editoriale di repertorio dedicata a Kimi Antonelli e alla Formula 1" loading="eager" decoding="async" fetchpriority="high"><figcaption>Illustrazione editoriale CurioMondo generata con IA e usata come immagine di repertorio; non raffigura il GP di Madrid.</figcaption></figure><section class="cm-insight"><span class="cm-kicker">Il punto in tre dati</span><div class="cm-insight-grid"><div><b>8</b><small>vittorie di Antonelli nel 2026</small></div><div><b>81</b><small>punti di vantaggio su Russell</small></div><div><b>14</b><small>gare disputate</small></div></div></section><article class="art-body" data-length-policy="3000-7000"><p>Kimi Antonelli ha vinto il primo Gran Premio di Formula 1 disputato sul nuovo circuito cittadino di Madrid, il Madring. Il ventenne della Mercedes ha tagliato il traguardo davanti a Max Verstappen e al campione del mondo Lando Norris, ottenendo l’ottavo successo della stagione 2026 e rafforzando in modo netto la leadership nel Mondiale piloti.</p><p>Norris era partito dalla pole position e sembrava avere il controllo della corsa, ma la gara è cambiata al quindicesimo giro. Una Virtual Safety Car è scattata nel momento ideale per Antonelli, Verstappen e George Russell, che hanno potuto effettuare la sosta perdendo meno tempo. Norris aveva appena superato l’ingresso dei box e ha dovuto attendere il giro successivo, quando la corsa era già tornata in regime normale.</p><p>Il successivo pit stop della McLaren è stato inoltre rallentato da un problema alla ruota anteriore destra. Secondo Reuters, McLaren e Pirelli hanno comunque indicato che il danno principale era già stato prodotto dal momento della neutralizzazione. Su un tracciato dove i sorpassi si sono rivelati difficili, Norris non è più riuscito a recuperare la posizione necessaria per tornare davanti.</p><p>Antonelli ha concluso con 4,3 secondi di vantaggio su Verstappen; Norris è arrivato terzo, a sette decimi dall’olandese. Charles Leclerc ha chiuso quarto con la Ferrari, mentre Russell si è classificato quinto. Lewis Hamilton si è ritirato nelle prime fasi della gara per un problema ai freni.</p><p>La vittoria porta Antonelli a otto successi nelle prime quattordici gare della stagione. Il vantaggio sul compagno Russell, secondo in classifica generale, sale a 81 punti. Mercedes guida anche il Mondiale costruttori con 503 punti, davanti alla Ferrari a 358 e alla McLaren a 306.</p><p>Russell, dopo la gara, ha riconosciuto che non si considera più realisticamente in lotta per il titolo piloti. Restano ancora diversi appuntamenti e matematicamente il campionato non è chiuso, ma il margine costruito da Antonelli rende ogni prossimo risultato particolarmente pesante nella corsa al titolo.</p><p>Il GP ha inaugurato il Madring come nuova sede spagnola della Formula 1. Le difficoltà nel sorpassare, già discusse durante il fine settimana, sono diventate uno dei temi principali della gara: dopo la fase decisiva legata alla Virtual Safety Car, le posizioni di vertice sono rimaste sostanzialmente congelate fino alla bandiera a scacchi.</p><p>Per Antonelli il successo arriva una settimana dopo la vittoria di Monza e conferma una fase di forma eccezionale. L’italiano, che nel 2026 è diventato il più giovane leader del Mondiale, si presenta ora al prossimo appuntamento di Baku con un margine tale da poter gestire il campionato senza rinunciare a cercare altre vittorie.</p></article><section class="curio-related" aria-labelledby="curio-related-title"><h2 id="curio-related-title">Potrebbe interessarti anche…</h2><div class="curio-related-grid"><a href="/notizie/kimi-antonelli-vince-gp-italia-monza-19esimo-6-settembre-2026.html"><small>Formula 1</small><strong>Antonelli, l’impresa di Monza</strong></a><a href="/notizie/leclerc-incidente-terzo-giro-gp-monza-ritiro-6-settembre-2026.html"><small>Formula 1</small><strong>Leclerc, incidente a Monza</strong></a><a href="/approfondimenti/come-si-rimonta-formula-1-strategia-vsc-pneumatici.html"><small>Approfondimento</small><strong>Come funziona una rimonta in Formula 1</strong></a></div></section><div class="art-sources"><h2>Fonti consultate</h2><ul><li><a href="https://www.reuters.com/sports/formula1/antonelli-stretches-lead-madrings-first-f1-winner-2026-09-13/" rel="noopener noreferrer" target="_blank">Reuters — risultato, strategia e classifica del GP di Madrid</a></li><li><a href="https://www.reuters.com/sports/formula1/russell-says-he-is-not-realistically-fight-f1-title-2026-09-13/" rel="noopener noreferrer" target="_blank">Reuters — dichiarazioni di Russell e situazione del Mondiale</a></li></ul><p><small>Testo originale CurioMondo. Ultimo aggiornamento editoriale: 13 settembre 2026, ore 22:58 italiane.</small></p></div></main><footer class="site-footer"><nav class="site-footer-links" aria-label="Informazioni"><a href="../pagine/chi-siamo.html">Chi siamo</a><a href="../pagine/contatti.html">Contatti</a><a href="../pagine/privacy.html">Privacy</a><a href="../pagine/cookie.html">Cookie</a><a href="../notizie/">Archivio</a></nav></footer><script src="../assets/js/site-common-v210.js" defer></script><script src="../assets/js/curiomondo-article-v210.js" defer></script></body></html>'''
          Path('notizie').mkdir(exist_ok=True)
          Path(f'notizie/{slug}.html').write_text(article,encoding='utf-8')

          # Categoria Sport: JSON-LD + card HTML
          p=Path('categorie/sport/index.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'<script type="application/ld\+json">(.*?)</script>',s,re.S)
          if m:
            data=json.loads(m.group(1)); items=data.get('mainEntity',{}).get('itemListElement',[])
            for it in items: it['position']=int(it.get('position',0))+1
            items.insert(0,{"@type":"ListItem","position":1,"url":url,"name":title})
            data['mainEntity']['itemListElement']=items; data['mainEntity']['numberOfItems']=len(items)
            s=s[:m.start(1)]+json.dumps(data,ensure_ascii=False,separators=(',',':'))+s[m.end(1):]
          s=re.sub(r'<strong>\d+ articoli</strong>',f'<strong>{len(items)} articoli</strong>',s,count=1)
          card=f'<li><a href="/notizie/{slug}.html"><span class="category-card-copy"><small>Sport / Formula 1 / GP di Spagna</small><strong>{title}</strong><span>{excerpt}</span></span><span class="category-card-arrow" aria-hidden="true">→</span></a></li>'
          s=s.replace('<ul class="category-list">','<ul class="category-list">'+card,1)
          p.write_text(s,encoding='utf-8')

          # Feed RSS: inserisce l'item in testa
          p=Path('feed.xml'); s=p.read_text(encoding='utf-8')
          item=f'''\n    <item><title>{html.escape(title)}</title><link>{url}</link><guid>{url}</guid><pubDate>Sun, 13 Sep 2026 20:58:00 GMT</pubDate><description>{html.escape(excerpt)}</description></item>'''
          s=s.replace('<channel>','<channel>'+item,1); p.write_text(s,encoding='utf-8')

          # Sitemap generale
          p=Path('sitemap.xml'); s=p.read_text(encoding='utf-8')
          entry=f'\n  <url><loc>{url}</loc><lastmod>2026-09-13</lastmod></url>'
          s=re.sub(r'(<urlset[^>]*>)',r'\1'+entry,s,count=1); p.write_text(s,encoding='utf-8')

          # Google News sitemap
          p=Path('news-sitemap.xml'); s=p.read_text(encoding='utf-8')
          n=f'''\n  <url><loc>{url}</loc><news:news><news:publication><news:name>CurioMondo</news:name><news:language>it</news:language></news:publication><news:publication_date>2026-09-13T22:58:00+02:00</news:publication_date><news:title>{html.escape(title)}</news:title></news:news></url>'''
          s=re.sub(r'(<urlset[^>]*>)',r'\1'+n,s,count=1); p.write_text(s,encoding='utf-8')
          PY
      - name: Pubblica su main
        shell: bash
        run: |
          rm -f .github/workflows/publish-antonelli-madrid-20260913.yml
          git config user.name "CurioMondo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Pubblica Antonelli vincitore del GP di Madrid"
          git push origin HEAD:main
