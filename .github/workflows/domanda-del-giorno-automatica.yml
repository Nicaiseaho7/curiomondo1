name: Domanda del giorno automatica

# Generatore e gate editoriale allineati il 14 settembre 2026.

on:
  push:
    paths:
      - '.github/workflows/domanda-del-giorno-automatica.yml'
      - 'automation/state/daily-questions.json'
  schedule:
    - cron: '0 22,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: domanda-del-giorno-automatica
  cancel-in-progress: false

jobs:
  pubblica-domanda:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CURIOMONDO_DAILY_QUESTIONS_JSON: ${{ secrets.CURIOMONDO_DAILY_QUESTIONS_JSON }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet lxml
      - name: Genera nuova Domanda del giorno
        run: python3 tools/daily_question_auto.py
      - name: Rigenera categorie e controlli statici
        run: |
          python3 tools/generate_category_pages.py
          python3 tools/predeploy.py
      - name: Pubblica modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Domanda del giorno già aggiornata: nessuna modifica."
            exit 0
          fi
          git commit -m "Aggiorna Domanda del giorno automatica"
          for tentativo in 1 2 3; do
            git push && exit 0
            git pull --rebase || true
            python3 tools/predeploy.py || exit 1
          done
          exit 1
