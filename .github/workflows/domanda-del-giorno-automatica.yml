name: Domanda del giorno automatica

on:
  schedule:
    # GitHub usa UTC: 22:00 copre mezzanotte italiana con ora legale,
    # 23:00 copre mezzanotte italiana con ora solare. Lo script evita duplicati.
    - cron: '0 22,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: domanda-del-giorno-automatica
  cancel-in-progress: false

jobs:
  pubblica-domanda:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CURIOMONDO_DAILY_QUESTIONS_JSON: ${{ secrets.CURIOMONDO_DAILY_QUESTIONS_JSON }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze controllo sito
        run: pip install lxml

      - name: Genera nuova Domanda del giorno
        run: python3 tools/daily_question_auto.py

      - name: Rigenera categorie e controlli statici
        run: |
          python3 tools/generate_category_pages.py
          python3 tools/predeploy.py

      - name: Pubblica modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Domanda del giorno gia aggiornata: nessuna modifica."
            exit 0
          fi
          git commit -m "Aggiorna Domanda del giorno automatica"
          git push
