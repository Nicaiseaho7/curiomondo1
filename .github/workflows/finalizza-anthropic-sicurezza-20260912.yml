name: Finalizza Anthropic sicurezza IA 12 settembre 2026

on:
  push:
    paths:
      - '.github/workflows/finalizza-anthropic-sicurezza-20260912.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalizza:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dipendenze
        run: pip install lxml pillow

      - name: Genera varianti immagine
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('assets/images/editorial-auto/anthropic-ai-sicurezza-rallentare-ai-openai-v337-320.webp')
          im=Image.open(src).convert('RGB')
          for w in (480,800,1200):
              h=round(w*2/3)
              out=src.with_name(f'anthropic-ai-sicurezza-rallentare-ai-openai-v337-{w}.webp')
              im.resize((w,h),Image.Resampling.LANCZOS).save(out,'WEBP',quality=78,method=6)
          PY

      - name: Registra immagine editoriale
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path('assets/data/editorial-images-v210.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          key='anthropic-ai-sicurezza-rallentare-ai-openai-v337'
          if not any(i.get('key')==key for i in d.get('items', [])):
              variants=[]
              for w in (480,800,1200):
                  f=Path(f'assets/images/editorial-auto/{key}-{w}.webp')
                  raw=f.read_bytes()
                  variants.append({'w':w,'src':'/'+f.as_posix(),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)})
              d['items'].insert(0,{
                  'key':key,
                  'article':'/notizie/anthropic-amodei-rallentare-intelligenza-artificiale-sicurezza-12-settembre-2026.html',
                  'aiGenerated':True,
                  'sensitiveContext':False,
                  'documentaryPhoto':False,
                  'prompt':'Scena editoriale contestuale ordinaria, laboratorio professionale di ricerca e sicurezza sull’intelligenza artificiale, ricercatori non riconoscibili davanti a sistemi di monitoraggio e visualizzazioni di reti neurali, fotografia ultrarealistica, nessun testo editoriale nei pixel.',
                  'variants':variants,
                  'alt':'Scena editoriale contestuale ordinaria generata con IA di un laboratorio di ricerca sull’intelligenza artificiale con ricercatori e sistemi di monitoraggio, senza persone pubbliche riconoscibili',
                  'disclosure':'Illustrazione editoriale CurioMondo generata con IA per rappresentare questa notizia; non è una fotografia documentaria.',
                  'portraitOnly':False,
                  'portraitFormat':'contextual-editorial-scene',
                  'reenactedEvent':False
              })
          d['version']=337
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Prepara finalizzatore v337
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/finalize_articles_20260906.py')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'TARGETS = \{.*?\}\n\nREG_PATH', 'TARGETS = {\n    "notizie/anthropic-amodei-rallentare-intelligenza-artificiale-sicurezza-12-settembre-2026.html": "anthropic-ai-sicurezza-rallentare-ai-openai-v337",\n}\n\nREG_PATH', s, count=1, flags=re.S)
          s=re.sub(r'VERSION\s*=\s*\d+', 'VERSION = 337', s)
          s=s.replace('if info["dateISO"][:10] < "2026-09-04": continue','if info["dateISO"][:10] < "2026-09-11": continue')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Aggiorna superfici editoriali
        run: python3 tools/finalize_articles_20260906.py

      - name: Aggiorna stato release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for name in ('curiomondo-site-manifest.json','RELEASE-STATE.json','CURIOMONDO-RELEASE-STATE.json'):
              p=Path(name)
              if not p.exists(): continue
              d=json.loads(p.read_text(encoding='utf-8'))
              if name=='curiomondo-site-manifest.json':
                  d.setdefault('site',{})['current_site_version']=337
                  d['site']['site_version']=337
              else:
                  for k in ('site_version','currentVersion'):
                      if k in d: d[k]=337
                  if 'version' in d: d['version']='337'
                  if 'baseline_version' in d: d['baseline_version']=336
                  if 'baselineVersion' in d: d['baselineVersion']=336
                  if 'release_date' in d: d['release_date']='2026-09-12'
                  if 'date' in d: d['date']='2026-09-12'
                  if 'last_update' in d: d['last_update']='anthropic-amodei-sicurezza-ai-v337'
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Gate predeploy
        run: python3 tools/predeploy.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi
          git commit -m "v337: pubblica Amodei e sicurezza IA"
          git push
