name: Finalizza OpenAI e Domanda del giorno 13 settembre 2026

on:
  push:
    paths:
      - '.github/workflows/finalizza-openai-daily-20260913.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalizza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml
      - name: Allinea Domanda del giorno
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          DATE='2026-09-13'
          SLUG='il-tempo-e-un-nemico-da-sconfiggere-o-un-alleato-da-ascoltare'
          TITLE='Il tempo è un nemico da sconfiggere o un alleato da ascoltare?'
          EXCERPT='Una riflessione sul rapporto con il tempo: controllo, fretta, attesa e capacità di riconoscere quando accelerare e quando lasciare maturare le cose.'
          OLD='esiste-un-modo-di-morire-che-sia-coerente-con-il-modo-in-cui-si-e-vissuti'

          p=Path('curiomondo-site-manifest.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          ds=m['daily_state']
          ds['current_question_source_number']=90
          used=ds.setdefault('used_question_source_numbers',[])
          if 90 not in used: used.append(90)
          ds['last_question_date']=DATE
          ds['last_question_slug']=SLUG
          m['site']['current_site_version']=341
          m['site']['site_version']=341
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          arch=Path('domanda-del-giorno/index.html')
          text=arch.read_text(encoding='utf-8')
          href=f'/domanda-del-giorno/{SLUG}/'
          if href not in text:
              card=f'<a class="cb-subcard" href="{href}"><span class="cb-kicker">13 settembre 2026</span><h2>{TITLE}</h2><p>{EXCERPT}</p><b>Leggi →</b></a>'
              text=text.replace('<section class="cb-subgrid">','<section class="cb-subgrid">'+card,1)
              arch.write_text(text,encoding='utf-8')

          home=Path('index.html')
          h=home.read_text(encoding='utf-8')
          pat=re.compile(r'<a[^>]+href="/domanda-del-giorno/'+re.escape(OLD)+r'/"[^>]*>.*?</a>',re.S)
          card=f'<a href="/domanda-del-giorno/{SLUG}/"><span>Domanda del giorno</span><strong>{TITLE}</strong><small>13 settembre 2026</small></a>'
          h2,n=pat.subn(card,h,count=1)
          if n:
              home.write_text(h2,encoding='utf-8')

          sp=Path('assets/data/search-index-v210.json')
          s=json.loads(sp.read_text(encoding='utf-8'))
          items=s.get('items',[])
          url=href
          items=[x for x in items if x.get('url')!=url]
          items.append({'title':TITLE,'excerpt':EXCERPT,'url':url,'section':'Domanda del giorno'})
          s['items']=items; s['version']=341
          sp.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          sm=Path('sitemap.xml')
          sx=sm.read_text(encoding='utf-8')
          loc=f'https://curiomondo.it/domanda-del-giorno/{SLUG}/'
          if loc not in sx:
              block=f'  <url><loc>{loc}</loc><lastmod>{DATE}</lastmod><changefreq>daily</changefreq><priority>0.7</priority></url>\n'
              sx=sx.replace('</urlset>',block+'</urlset>')
              sm.write_text(sx,encoding='utf-8')
          PY
      - name: Aggiorna superfici articolo
        run: |
          python3 tools/finalize_articles_20260906.py
          python3 tools/generate_category_pages.py
      - name: Porta aggiornamento IA in evidenza e allinea release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          VERSION=341
          URL='/notizie/anthropic-amodei-rallentare-intelligenza-artificiale-sicurezza-12-settembre-2026.html'
          TITLE='IA, Altman esclude l’IPO OpenAI nel 2026 e sostiene il rallentamento chiesto da Amodei'
          EXCERPT='OpenAI esclude una quotazione nel 2026 mentre Sam Altman sostiene il rallentamento dei modelli di frontiera proposto da Dario Amodei per rafforzare la sicurezza.'
          for rel in ('assets/data/home-feed-v210.json','assets/data/search-index-v210.json'):
              p=Path(rel); d=json.loads(p.read_text(encoding='utf-8'))
              items=d.get('items',[])
              found=None
              for i,x in enumerate(items):
                  if x.get('url')==URL:
                      found=items.pop(i); break
              if found:
                  found['title']=TITLE; found['excerpt']=EXCERPT
                  items.insert(0,found)
              d['items']=items; d['version']=VERSION
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          rp=Path('assets/data/editorial-images-v210.json')
          r=json.loads(rp.read_text(encoding='utf-8')); r['version']=VERSION
          rp.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          mp=Path('curiomondo-site-manifest.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
          m['site']['current_site_version']=VERSION; m['site']['site_version']=VERSION
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for rel in ('CURIOMONDO-RELEASE-STATE.json','RELEASE-STATE.json'):
              p=Path(rel)
              if not p.exists(): continue
              d=json.loads(p.read_text(encoding='utf-8'))
              d['site_version']=VERSION; d['version']=str(VERSION); d['currentVersion']=VERSION
              d['baseline_version']=340; d['baselineVersion']=340
              d['date']='2026-09-13'; d['release_date']='2026-09-13'
              d['last_update']='openai-altman-ipo-sicurezza-ai-v341'
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Controllo predeploy
        run: python3 tools/predeploy.py
      - name: Pubblica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v341: aggiorna OpenAI e Domanda del giorno 13 settembre"
          git push
