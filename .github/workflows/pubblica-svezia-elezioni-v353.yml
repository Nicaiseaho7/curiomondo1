name: Pubblica elezioni Svezia v353
on:
  push:
    paths:
      - 'tools/build_v353.py'
      - '.github/workflows/pubblica-svezia-elezioni-v353.yml'
      - 'assets/images/editorial-source/svezia-centrosinistra-avanti-elezioni-14-settembre-2026.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Genera articolo e superfici
        run: python tools/build_v353.py
      - name: Verifica predeploy
        run: python tools/predeploy.py
      - name: Commit pubblicazione
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v353: pubblica elezioni svedesi"
          git push
