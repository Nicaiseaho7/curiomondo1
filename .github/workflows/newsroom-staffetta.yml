name: Redazione · Staffetta continua

# GitHub esegue i cron "al meglio possibile": stanotte potrebbero scattare ogni
# cinque minuti, oppure tacere per ore. Per non dipendere da quella promessa, un
# solo lavoro resta acceso per ore e ripete il ciclo a intervalli regolari.
#
# Il testimone passa da solo: il cron orario mette in coda la staffetta
# successiva, che il gruppo di concorrenza tiene ferma finche quella in corso non
# finisce. Quando finisce, la successiva parte. Se un runner muore, entro un'ora
# il cron ne rimette una in pista.

on:
  workflow_dispatch:
    inputs:
      intervallo:
        description: 'Minuti fra un ciclo e il successivo'
        type: string
        default: '15'
        required: false
      durata:
        description: 'Per quanti minuti restare in pista'
        type: string
        default: '320'
        required: false
  schedule:
    - cron: '7 * * * *'     # rimette in pista la staffetta se si e fermata

permissions:
  contents: write

concurrency:
  # Una sola staffetta alla volta; la successiva aspetta in coda e prende il
  # testimone appena questa termina.
  group: redazione-staffetta
  cancel-in-progress: false

jobs:
  staffetta:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze della redazione
        run: pip install --quiet lxml Pillow

      - name: Recupera lo stato della redazione
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" automation-state >/dev/null 2>&1; then
            git clone --quiet --branch automation-state --depth 30 "$REPO_URL" .state
          else
            mkdir -p .state && cd .state && git init --quiet && git checkout --quiet -b automation-state
          fi

      - name: Cicli a intervalli regolari
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INTERVALLO: ${{ inputs.intervallo || '15' }}
          DURATA: ${{ inputs.durata || '320' }}
        run: |
          git config user.name "curiomondo-newsroom[bot]"
          git config user.email "curiomondo-newsroom@users.noreply.github.com"
          cd .state && git config user.name "curiomondo-newsroom[bot]" \
            && git config user.email "curiomondo-newsroom@users.noreply.github.com" && cd ..

          fine=$(( $(date +%s) + DURATA * 60 ))
          giro=0
          pubblicati=0
          while [ "$(date +%s)" -lt "$fine" ]; do
            giro=$((giro + 1))
            # Una scansione ampia ogni quattro giri: le fonti istituzionali non
            # pubblicano abbastanza spesso da meritare ogni ciclo.
            if [ $((giro % 4)) -eq 0 ]; then CADENZA=deep; else CADENZA=fast; fi
            echo "::group::Ciclo $giro ($CADENZA)"
            if CADENZA="$CADENZA" MASSIMO=2 bash tools/ciclo_redazione.sh; then
              grep -q '"articoli": 0' /tmp/publish.json 2>/dev/null || pubblicati=$((pubblicati + 1))
            else
              echo "ciclo $giro non riuscito: la staffetta prosegue"
            fi
            echo "::endgroup::"
            restano=$(( fine - $(date +%s) ))
            [ "$restano" -le $(( INTERVALLO * 60 )) ] && break
            sleep $(( INTERVALLO * 60 ))
          done

          {
            echo "### Staffetta conclusa"
            echo ""
            echo "- cicli eseguiti: **$giro**"
            echo "- cicli con pubblicazione: **$pubblicati**"
            echo "- intervallo: ${INTERVALLO} minuti"
          } >> "$GITHUB_STEP_SUMMARY"
