name: Aggiorna Yemen ed energia 12 settembre 2026

on:
  push:
    paths:
      - '.github/workflows/aggiorna-yemen-energia-20260912.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dipendenze
        run: pip install lxml

      - name: Aggiorna articolo Yemen con sviluppi 12 settembre
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('notizie/yemen-houthi-dhubab-bab-el-mandeb-11-settembre-2026.html')
          s = p.read_text(encoding='utf-8')

          old_title = 'Yemen, gli Houthi raggiungono Perim nel Bab el-Mandeb'
          new_title = 'Bab el-Mandeb, Houthi su Perim: fermato l’oleodotto saudita Est-Ovest'
          s = s.replace(old_title, new_title)

          s = re.sub(
              r'<meta name="description" content="[^"]*">',
              '<meta name="description" content="Gli Houthi consolidano la presa su Perim mentre l’Arabia Saudita ferma temporaneamente l’oleodotto Est-Ovest dopo un attacco con droni partito dall’Iraq. Riyadh chiede assistenza militare agli Stati Uniti.">',
              s,
              count=1,
          )
          s = re.sub(
              r'<meta property="og:description" content="[^"]*">',
              '<meta property="og:description" content="Perim e l’oleodotto Est-Ovest mettono sotto pressione due rotte energetiche decisive tra Mar Rosso e Golfo.">',
              s,
              count=1,
          )
          s = re.sub(
              r'<meta name="twitter:description" content="[^"]*">',
              '<meta name="twitter:description" content="Perim e l’oleodotto Est-Ovest mettono sotto pressione due rotte energetiche decisive tra Mar Rosso e Golfo.">',
              s,
              count=1,
          )
          s = re.sub(
              r'"dateModified":"[^"]+"',
              '"dateModified":"2026-09-12T07:30:00+02:00"',
              s,
          )

          marker = '<h2>Perché Perim conta così tanto</h2>'
          update = '''<section class="article-update" aria-labelledby="aggiornamento-12-settembre"><h2 id="aggiornamento-12-settembre">Aggiornamento del 12 settembre: fermato l’oleodotto Est-Ovest</h2><p>L’Arabia Saudita ha fermato temporaneamente il suo oleodotto Est-Ovest dopo un attacco con droni che, secondo Riyadh e Baghdad, è partito dall’Iraq. Il ministero saudita dell’Energia ha indicato la chiusura come misura precauzionale mentre sono in corso le verifiche sui danni.</p><p>La condotta lunga circa 1.200 chilometri permette di trasferire greggio verso il Mar Rosso evitando lo Stretto di Hormuz. Secondo Reuters, negli ultimi mesi trasportava fra 4 e 5 milioni di barili al giorno, pari a circa il 4-5% dell’offerta mondiale: per questo la sua indisponibilità, insieme alla pressione sul Bab el-Mandeb, aumenta il rischio per i flussi energetici globali.</p><p>Fonti citate da Reuters riferiscono inoltre che il principe ereditario Mohammed bin Salman ha chiesto a Washington assistenza militare contro gli Houthi. Gli Stati Uniti non avrebbero accettato per ora attacchi diretti, offrendo invece condivisione di intelligence e supporto al targeting. L’Iraq ha intanto rimosso un comandante militare nella provincia di Maysan e chiuso in via precauzionale il valico di Shalamcheh con l’Iran mentre proseguono le indagini sull’origine dell’attacco.</p><p>Il quadro resta in rapido sviluppo: non è stata attribuita pubblicamente una responsabilità definitiva per l’attacco all’oleodotto, mentre l’Arabia Saudita ha dichiarato di non voler reagire nell’immediato su richiesta del governo iracheno, riservandosi però misure per proteggere infrastrutture e sicurezza nazionale.</p></section>'''
          if 'aggiornamento-12-settembre' not in s and marker in s:
              s = s.replace(marker, update + marker, 1)

          source_marker = '</ul></div>'
          source_item = '<li><a href="https://www.reuters.com/business/energy/saudis-shut-down-oil-pipeline-houthis-tighten-grip-red-sea-shipping-2026-09-12/" target="_blank" rel="noopener noreferrer">Reuters, 12 settembre 2026 — Arabia Saudita: oleodotto Est-Ovest fermato dopo l’attacco, Houthi su Perim e richiesta di assistenza USA</a></li>'
          if source_item not in s:
              pos = s.find(source_marker)
              if pos != -1:
                  s = s[:pos] + source_item + s[pos:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Prepara finalizzatore v330
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/finalize_articles_20260906.py')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'TARGETS = \{.*?\}\n\nREG_PATH', 'TARGETS = {\n    "notizie/yemen-houthi-dhubab-bab-el-mandeb-11-settembre-2026.html": "yemen-dhubab-bab-el-mandeb-ai-v321",\n}\n\nREG_PATH', s, count=1, flags=re.S)
          s=s.replace('285','330')
          s=s.replace('if info["dateISO"][:10] < "2026-09-04": continue','if info["dateISO"][:10] < "2026-09-10": continue')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Aggiorna superfici editoriali
        run: python3 tools/finalize_articles_20260906.py

      - name: Aggiorna stato release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for name in ('curiomondo-site-manifest.json','RELEASE-STATE.json','CURIOMONDO-RELEASE-STATE.json'):
              p=Path(name)
              if not p.exists():
                  continue
              d=json.loads(p.read_text(encoding='utf-8'))
              if name=='curiomondo-site-manifest.json':
                  d.setdefault('site',{})['current_site_version']=330
                  d['site']['site_version']=330
              else:
                  if 'site_version' in d: d['site_version']=330
                  if 'currentVersion' in d: d['currentVersion']=330
                  if 'version' in d: d['version']='330'
                  if 'baseline_version' in d: d['baseline_version']=329
                  if 'baselineVersion' in d: d['baselineVersion']=329
                  if 'release_date' in d: d['release_date']='2026-09-12'
                  if 'date' in d: d['date']='2026-09-12'
                  if 'last_update' in d: d['last_update']='yemen-perim-oleodotto-est-ovest-v330'
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Gate predeploy
        run: python3 tools/predeploy.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi
          git commit -m "v330: aggiorna Yemen, Perim e oleodotto saudita"
          git push
