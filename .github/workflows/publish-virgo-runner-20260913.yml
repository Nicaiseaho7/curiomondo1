name: Pubblica Virgo Transport 8 runner

on:
  push:
    branches: ['automation/publish-virgo-20260913']
    paths: ['automation/publish_virgo_20260913.py']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/publish-virgo-20260913
          fetch-depth: 0
      - name: Dipendenze audit
        run: python3 -m pip install --quiet lxml
      - name: Prepara pubblicazione
        run: python3 automation/publish_virgo_20260913.py
      - name: Gate predeploy
        run: python3 tools/predeploy.py
      - name: Commit finale verificato
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f automation/publish_virgo_20260913.py
          git rm -f .github/workflows/publish-virgo-runner-20260913.yml
          git rm -f .github/workflows/publish-virgo-20260913.yml
          git add -A
          git commit -m "v347: pubblica naufragio Virgo Transport 8 in Indonesia"
          git push origin HEAD:automation/publish-virgo-20260913
