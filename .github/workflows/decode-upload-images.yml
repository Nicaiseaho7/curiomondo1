name: Decode uploaded images
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/uploads/**/*.b64'
      - 'assets/uploads/**/*.part'
      - 'assets/uploads/**/*.manifest'
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble parts and decode
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for man in assets/uploads/**/*.manifest; do
            dir=$(dirname "$man")
            base=$(basename "$man" .manifest)
            target_b64="$dir/$base"
            : > "$target_b64"
            while IFS= read -r part; do
              [ -z "$part" ] && continue
              cat "$dir/$part" >> "$target_b64"
              rm -f "$dir/$part"
            done < "$man"
            rm -f "$man"
            echo "assembled $target_b64"
          done
          for f in assets/uploads/**/*.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            rm -f "$f"
            echo "decoded $out ($(wc -c < "$out") bytes)"
          done
      - name: Commit images
        run: |
          git config user.name "CurioMondo Bot"
          git config user.email "bot@curiomondo.it"
          git add -A assets/uploads
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Aggiunge immagini editoriali (decode b64)"
          git push
