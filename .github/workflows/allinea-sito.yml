name: Allinea repository al sito pubblicato

on:
  push:
    paths:
      - '.github/workflows/allinea-sito.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: Zip-31-agosto
  ASSET: curiomondo-v255-31-agosto-2026-incendi-domanda-ferita-netlify.zip

jobs:
  allinea:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Scarica lo zip dalla Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          echo "Release cercata: $TAG / $ASSET"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir /tmp --clobber
          ls -lh /tmp/*.zip

      - name: Estrai lo zip
        run: |
          set -x
          mkdir -p /tmp/sito
          unzip -q "/tmp/$ASSET" -d /tmp/sito
          ls /tmp/sito | head -20
          if [ ! -f /tmp/sito/index.html ]; then
            INNER="$(find /tmp/sito -mindepth 1 -maxdepth 1 -type d | head -1)"
            if [ -n "$INNER" ] && [ -f "$INNER/index.html" ]; then
              mv "$INNER" /tmp/sito-inner && rm -rf /tmp/sito && mv /tmp/sito-inner /tmp/sito
            fi
          fi
          test -f /tmp/sito/index.html
          echo "File estratti: $(find /tmp/sito -type f | wc -l)"

      - name: Sostituisci il contenuto del repository
        run: |
          set -x
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -not -name '.github' -exec rm -rf {} +
          cp -a /tmp/sito/. .
          echo "File ora presenti: $(find . -type f -not -path './.git/*' | wc -l)"
          echo "Articoli: $(ls notizie/*.html | wc -l)"

      - name: Pubblica le modifiche
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository gia allineato."
            exit 0
          fi
          git commit -m "Allinea il repository al sito pubblicato (v255, 31 agosto 2026)"
          git push
          echo "Allineamento completato."
