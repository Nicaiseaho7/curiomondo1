name: Assemble HTML from zlib b64
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/uploads/2026-09-20/html-parts/*.zlib.b64'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decompress homepage and notizie index
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, zlib
          from pathlib import Path
          DIR = Path('assets/uploads/2026-09-20/html-parts')
          mapping = {
            'index.html.zlib.b64': Path('index.html'),
            'notizie__index.html.zlib.b64': Path('notizie/index.html'),
          }
          for src_name, dest in mapping.items():
            src = DIR / src_name
            if not src.exists():
              print('skip missing', src)
              continue
            data = zlib.decompress(base64.b64decode(src.read_text().strip()))
            dest.parent.mkdir(parents=True, exist_ok=True)
            dest.write_bytes(data)
            print(f'wrote {dest} ({len(data)} bytes)')
            text = data.decode('utf-8')
            assert 'PLACEHOLDER' not in text or 'legge-elettorale' in text
            assert not text.strip().startswith('@file')
            assert not text.strip().startswith('SEE_FILE')
            if dest.name == 'index.html':
              assert 'legge-elettorale-alla-camera' in text
          PY
      - name: Commit assembled HTML
        run: |
          git config user.name "CurioMondo Bot"
          git config user.email "bot@curiomondo.it"
          git add -A index.html notizie/index.html assets/uploads/2026-09-20/html-parts
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "Ripristina index.html homepage con articoli 20-09-2026"
          git push
