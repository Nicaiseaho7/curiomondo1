name: Finalizza traghetto Filippine 12 settembre 2026

on:
  push:
    paths:
      - '.github/workflows/finalizza-filippine-june-aster-20260912.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalizza:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dipendenze
        run: pip install lxml pillow

      - name: Genera varianti immagine
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('assets/images/editorial-auto/filippine-june-aster-ai-openai-v332-480.webp')
          im=Image.open(src).convert('RGB')
          for w in (800,1200):
              h=round(w*2/3)
              out=src.with_name(f'filippine-june-aster-ai-openai-v332-{w}.webp')
              im.resize((w,h),Image.Resampling.LANCZOS).save(out,'WEBP',quality=76,method=6)
          PY

      - name: Prepara finalizzatore v332
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/finalize_articles_20260906.py')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'TARGETS = \{.*?\}\n\nREG_PATH', 'TARGETS = {\n    "notizie/filippine-incendio-traghetto-june-aster-35-morti-12-settembre-2026.html": "filippine-june-aster-ai-openai-v332",\n}\n\nREG_PATH', s, count=1, flags=re.S)
          s=s.replace('285','332')
          s=s.replace('if info["dateISO"][:10] < "2026-09-04": continue','if info["dateISO"][:10] < "2026-09-11": continue')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Aggiorna superfici editoriali
        run: python3 tools/finalize_articles_20260906.py

      - name: Aggiorna stato release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for name in ('curiomondo-site-manifest.json','RELEASE-STATE.json','CURIOMONDO-RELEASE-STATE.json'):
              p=Path(name)
              if not p.exists(): continue
              d=json.loads(p.read_text(encoding='utf-8'))
              if name=='curiomondo-site-manifest.json':
                  d.setdefault('site',{})['current_site_version']=332
                  d['site']['site_version']=332
              else:
                  for k in ('site_version','currentVersion'):
                      if k in d: d[k]=332
                  if 'version' in d: d['version']='332'
                  if 'baseline_version' in d: d['baseline_version']=331
                  if 'baselineVersion' in d: d['baselineVersion']=331
                  if 'release_date' in d: d['release_date']='2026-09-12'
                  if 'date' in d: d['date']='2026-09-12'
                  if 'last_update' in d: d['last_update']='filippine-june-aster-incendio-v332'
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Gate predeploy
        run: python3 tools/predeploy.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi
          git commit -m "v332: pubblica incendio traghetto June Aster nelle Filippine"
          git push
