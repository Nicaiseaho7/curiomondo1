name: Sito · Pubblica una bozza

# Vassoio in entrata per gli articoli scritti fuori dalla redazione automatica,
# per esempio con ChatGPT: basta salvare un file .json nella cartella bozze/ e
# il sito lo pubblica da solo.
#
# La bozza passa dagli stessi controlli della redazione e dallo stesso gate:
# se qualcosa non torna non viene pubblicato niente, il file resta dov'e e il
# motivo compare qui nei log.

on:
  push:
    paths:
      - 'bozze/**.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblica-bozza
  cancel-in-progress: false

jobs:
  pubblica:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet lxml Pillow

      - name: Pubblica le bozze presenti
        id: pubblica
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          shopt -s nullglob
          bozze=(bozze/*.json)
          if [ ${#bozze[@]} -eq 0 ]; then
            echo "Nessuna bozza da pubblicare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "curiomondo-redazione[bot]"
          git config user.email "curiomondo-redazione@users.noreply.github.com"

          pubblicati=0
          for bozza in "${bozze[@]}"; do
            echo "::group::$bozza"
            if python3 tools/pubblica_articolo.py --file "$bozza" > /tmp/esito.json; then
              cat /tmp/esito.json
              url=$(python3 -c "import json;print(json.load(open('/tmp/esito.json'))['url'])")
              rm -f "$bozza"
              pubblicati=$((pubblicati + 1))
              echo "- pubblicato: $url" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- **$bozza non pubblicata**: vedi i log qui sopra per il motivo" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done

          if [ "$pubblicati" -eq 0 ]; then
            echo "Nessuna bozza superava i controlli." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git add notizie assets/data assets/images/editorial-auto categorie index.html \
                  feed.xml sitemap.xml news-sitemap.xml curiomondo-site-manifest.json bozze
          git commit --quiet -m "Pubblica $pubblicati articolo/i dalla cartella bozze"
          for tentativo in 1 2 3; do
            git push --quiet "$REPO_URL" HEAD:main && exit 0
            git pull --rebase --quiet "$REPO_URL" main || true
            python3 tools/predeploy.py >/dev/null || exit 1
          done
          exit 1
