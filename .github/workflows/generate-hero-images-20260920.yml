name: Generate hero JPEGs 2026-09-20
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet Pillow
      - name: Generate 1280x720 hero JPEGs
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw
          import os
          os.makedirs('assets/uploads/2026-09-20', exist_ok=True)
          specs = [
            ('legge-elettorale-camera-20-settembre-2026.jpg', (20,40,80), (40,80,140), 'Camera / Legge elettorale'),
            ('aspides-mar-rosso-20-settembre-2026.jpg', (10,30,60), (180,90,40), 'Aspides / Mar Rosso'),
            ('trump-ai-force-20-settembre-2026.jpg', (15,15,40), (80,40,120), 'AI Force'),
            ('meloni-scuola-fenix-20-settembre-2026.jpg', (30,50,30), (90,120,60), 'Scuola / Fenix'),
            ('trump-iran-dichiarazioni-20-settembre-2026.jpg', (40,20,20), (100,40,30), 'Iran / Dichiarazioni'),
            ('roma-scuola-centocelle-20-settembre-2026.jpg', (50,50,50), (120,120,110), 'Roma / Centocelle'),
          ]
          for name, c1, c2, label in specs:
            im = Image.new('RGB', (1280, 720), c1)
            d = ImageDraw.Draw(im)
            for y in range(720):
              t = y/719
              col = tuple(int(c1[i]*(1-t)+c2[i]*t) for i in range(3))
              d.line([(0,y),(1279,y)], fill=col)
            d.rectangle([40,40,1240,680], outline=(255,255,255), width=3)
            d.text((60,320), label, fill=(255,255,255))
            d.text((60,360), 'Illustrazione editoriale CurioMondo', fill=(220,220,220))
            path=f'assets/uploads/2026-09-20/{name}'
            im.save(path, 'JPEG', quality=85, optimize=True)
            print(path, os.path.getsize(path))
          PY
      - name: Commit
        run: |
          git config user.name "CurioMondo Bot"
          git config user.email "bot@curiomondo.it"
          git add assets/uploads/2026-09-20/*.jpg
          git commit -m "Genera hero JPEG 1280x720 per articoli 20 set 2026" || echo no changes
          git push
