name: Rigenera volti copertine 26 settembre

# Un solo giro: gpt-image-1 rifà le copertine in cui manca il protagonista.
# La chiave non viene mai stampata. Se manca, il giro si ferma senza commit.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rigenera-volti-20260926.yml
      - automation/newsroom/rigenera_volti_20260926.py

permissions:
  contents: write

jobs:
  volti:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: pip install -r automation/requirements.txt
      - name: Genera le copertine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 -m automation.newsroom.rigenera_volti_20260926
      - name: Pubblica solo se ci sono immagini nuove
        run: |
          git config user.name "Nicaiseaho7"
          git config user.email "201093076+Nicaiseaho7@users.noreply.github.com"
          git add assets/images/editorial-auto assets/data notizie index.html categorie feed.xml sitemap.xml news-sitemap.xml
          if git diff --cached --quiet; then
            echo "Nessun file da pubblicare."
            exit 0
          fi
          git commit -m "Copertine del 26 settembre con il protagonista, via gpt-image-1."
          git push
